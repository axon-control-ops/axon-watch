  </defs>

  <rect width="64" height="64" rx="14" fill="url(#tile-bg)" />
  <rect
    x="1.5"
    y="1.5"
    width="61"
    height="61"
    rx="12.5"
    fill="none"
    stroke="#48c4ff"
    stroke-opacity="0.42"
    stroke-width="1.2"
  />
  <rect width="64" height="64" rx="14" fill="url(#sheen)" />

  <g filter="url(#glow)" fill="none" stroke="url(#mark-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18.5 45.5 L32 18.5 L45.5 45.5" />
    <path d="M45.5 18.5 L18.5 45.5" />
  </g>
  <rect
    x="26.8"
