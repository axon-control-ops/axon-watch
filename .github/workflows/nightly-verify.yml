name: Axon-X Nightly Strict Verify

on:
  schedule:
    # 02:15 UTC daily
    - cron: "15 2 * * *"
  workflow_dispatch:

jobs:
  nightly-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workspace dependencies
        run: npm ci

      - name: Strict-pending verify (contracts + console + scaffold)
        run: ./scripts/dev/verify-with-evidence.sh --strict-pending
