[project]
name = "axon-watch-control-plane"
version = "0.1.0"
description = "Bootstrap control-plane service shell for Axon-Watch."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "python-multipart",
  # Required for the workspace terminal WebSocket endpoint; uvicorn refuses
  # WS upgrades with a 500 when no websocket protocol library is installed.
  "websockets>=12,<16",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
