[project]
name = "axon-watch-service"
version = "0.1.0"
description = "Bootstrap watch service shell for Axon-Watch."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "cryptography>=42,<45",
  "pyotp>=2.9,<3.0",
  "python-multipart",
]

[project.optional-dependencies]
qr = ["qrcode[pil]>=7.4,<9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
